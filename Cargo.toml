[package]
name = "simpledarkeq"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
slint = "=1.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
regex = "1"
rustfft = "6.4"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
resonance-ipc = { path = "vendor/resonance/crates/resonance-ipc" }

[target.'cfg(windows)'.dependencies]
cpal = "=0.17.3"

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[profile.release]
lto = true
strip = true

