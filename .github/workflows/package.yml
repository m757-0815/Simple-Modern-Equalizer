name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain and WiX
        shell: pwsh
        run: |
          rustup show
          dotnet tool install --global wix --version 4.0.6
          wix extension add -g WixToolset.Util.wixext/4.0.6
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload Windows MSI
        uses: actions/upload-artifact@v7
        with:
          path: dist/SimpleModernEqualizer-Setup-x64.msi
          archive: false
          if-no-files-found: error
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          path: dist/windows/simple-modern-equalizer.exe
          archive: false
          if-no-files-found: error

  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          rustup show
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev libclang-dev libudev-dev libxkbcommon-dev libfontconfig1-dev libgl1-mesa-dev squashfs-tools
      - name: Build AppImage
        run: sh scripts/build-appimage.sh
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        with:
          path: dist/Simple-Modern-Equalizer-x86_64.AppImage
          archive: false
          if-no-files-found: error

  fedora:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git gcc gcc-c++ pkgconf-pkg-config pipewire-devel clang-devel systemd-devel libxkbcommon-devel fontconfig-devel mesa-libGL-devel rpm-build desktop-file-utils python3 curl
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Build and check Fedora RPM
        run: |
          rustup show
          sh scripts/build-fedora.sh
          rpm -qpl dist/*.rpm
          dnf install -y dist/*.rpm
          test -x /usr/bin/simple-modern-equalizer
          test -x /usr/libexec/simple-modern-equalizer/resonanced
      - name: Upload Fedora RPM
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.rpm
          archive: false
          if-no-files-found: error

  deb:
    name: Build .deb for ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            platform: Ubuntu-24.04
          - image: debian:13
            platform: Debian-13
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies and rustup
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang curl desktop-file-utils dpkg-dev git libclang-dev \
            libegl-dev libfontconfig-dev libgl-dev libpipewire-0.3-dev libspa-0.2-dev \
            libudev-dev libxkbcommon-dev pkg-config python3
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Build and check Debian package
        run: |
          rustup show
          sh scripts/build-deb.sh
          dpkg-deb --contents dist/*.deb
          apt-get install -y --no-install-recommends ./dist/*.deb
          test -x /usr/bin/simple-modern-equalizer
          test -x /usr/lib/simple-modern-equalizer/resonanced
          test -s /usr/share/icons/hicolor/256x256/apps/simple-modern-equalizer.png
      - name: Upload distribution package
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.deb
          archive: false
          if-no-files-found: error

  #######################################################
  # build the Linux Flatpak bundle
  #######################################################

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Build Flatpak
        run: sh scripts/build-flatpak.sh
      - name: Upload Linux Flatpak
        uses: actions/upload-artifact@v7
        with:
          path: dist/Simple-Modern-Equalizer-x86_64.flatpak
          archive: false
          if-no-files-found: error

  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: git archive --prefix=Simple-Modern-Equalizer/ -o Simple-Modern-Equalizer-source.tar.gz HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          path: Simple-Modern-Equalizer-source.tar.gz
          archive: false
          if-no-files-found: error

  #######################################################
  # publish installers after all tagged builds succeed
  #######################################################

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    needs: [windows, appimage, fedora, deb, flatpak, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-release-${{ github.ref }}
    steps:
      - name: Download the built packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish the release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s failglob
          assets=(
            release-assets/Simple-Modern-Equalizer-x86_64.AppImage
            release-assets/Simple-Modern-Equalizer-x86_64.flatpak
            release-assets/simple-modern-equalizer-*.fc44.x86_64.rpm
            release-assets/simple-modern-equalizer_*+ubuntu24.04_amd64.deb
            release-assets/simple-modern-equalizer_*+debian13_amd64.deb
            release-assets/SimpleModernEqualizer-Setup-x64.msi
            release-assets/Simple-Modern-Equalizer-source.tar.gz
          )
          if (( ${#assets[@]} != 7 )); then
            printf 'Expected seven release assets, found %s.\n' "${#assets[@]}" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" || ! -s "$asset" ]]; then
              printf 'Missing or empty release asset: %s\n' "$asset" >&2
              exit 1
            fi
          done

          # Reuse a draft if an upload was interrupted.
          draft=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | [.tag_name, .draft] | @tsv' |
            awk -F '\t' -v tag="$RELEASE_TAG" '$1 == tag { print $2 }')
          case "$draft" in
            false)
              printf 'Release %s is already published.\n' "$RELEASE_TAG"
              ;;
            true)
              gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
              gh release edit "$RELEASE_TAG" --draft=false
              ;;
            '')
              flags=(--verify-tag --generate-notes)
              if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
                flags+=(--prerelease)
              fi
              gh release create "$RELEASE_TAG" "${flags[@]}" "${assets[@]}"
              ;;
            *)
              printf 'Found multiple releases for %s.\n' "$RELEASE_TAG" >&2
              exit 1
              ;;
          esac
