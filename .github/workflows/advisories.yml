name: Rust dependency advisories

#######################################################
# audit both shipped Rust dependency lockfiles
#######################################################

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.lockfile }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lockfile: [Cargo.lock, vendor/resonance/Cargo.lock]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the pinned RustSec scanner
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Check the lockfile
        env:
          LOCKFILE: ${{ matrix.lockfile }}
        run: cargo audit --file "$LOCKFILE"
