name: Compile and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev libclang-dev libudev-dev libxkbcommon-dev libfontconfig1-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: cargo build --locked --manifest-path vendor/resonance/Cargo.toml --release -p resonance-daemon
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SIMPLEDARKEQ_TEST_ENGINE = (Resolve-Path vendor/resonance/target/release/resonanced.exe).Path
          cargo test --locked windows_daemon_accepts_full_sync_and_incremental_edits -- --ignored
